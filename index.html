<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:,">
<title>记一餐</title>
<style>
  :root{
    --bg:#0b0b0c; --fg:#f2f2f3; --dim:#8a8a90; --line:#232326;
    --accent:#4ade80; --warn:#fbbf24;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",sans-serif}
  body{padding:max(18px,env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto; min-height:100vh}
  .hint{color:var(--dim); font-size:13px; letter-spacing:.02em}
  h1{font-size:15px; font-weight:600; margin:0 0 14px; color:var(--dim)}

  /* 输入区：打开即输入框，自动聚焦 */
  form{margin:0}
  input[type=text]{
    width:100%; font-size:22px; padding:16px 16px; border-radius:14px;
    background:#141416; color:var(--fg); border:1px solid var(--line);
    outline:none; font-family:inherit;
  }
  input[type=text]:focus{border-color:#3a3a40}
  input[type=text]::placeholder{color:#55555c}

  /* 四个大按钮，当前时段自动高亮 */
  .slots{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0 0}
  .slot{
    padding:14px 0; border-radius:12px; border:1px solid var(--line);
    background:#141416; color:var(--dim); font-size:15px; font-weight:500;
    font-family:inherit; cursor:pointer; transition:.12s;
  }
  .slot[aria-pressed=true]{background:var(--accent); border-color:var(--accent); color:#08210f; font-weight:700}

  /* 记完立刻给判断 */
  .fb{min-height:24px; margin:16px 2px 6px; font-size:15px; color:var(--fg)}
  .fb b{color:var(--accent); font-weight:600}
  .fb .goal{color:var(--dim); font-weight:400}

  .days{margin-top:14px; border-top:1px solid var(--line)}
  .day{padding:12px 2px 4px}
  .day h2{font-size:12px; font-weight:600; color:var(--dim); margin:0 0 6px; letter-spacing:.04em}
  .row{display:flex; align-items:center; gap:10px; padding:3px 0; border-bottom:1px solid #1a1a1d}
  .row .t{color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; min-width:44px}
  .row .s{color:var(--dim); font-size:12px; border:1px solid var(--line); border-radius:5px; padding:0 5px}
  .row .w{flex:1; font-size:16px}
  /* 移动端最小可点区域 44×44：自动巡检实测原尺寸约 26×22，手指点不准 */
  .row button{
    background:none; border:0; color:#4a4a50; font-size:18px; line-height:1; cursor:pointer;
    padding:0; min-width:44px; min-height:44px; margin-right:-10px; border-radius:8px;
  }
  .row button:active{color:#e05252}

  .empty{color:var(--dim); padding:22px 2px; font-size:14px}
  footer{margin-top:26px; padding-top:10px; border-top:1px solid var(--line);
    display:flex; gap:4px; font-size:13px}
  /* 同样按 44px 最小可点区域：原来「清空」只有 26×18，而它是破坏性操作 */
  footer button{background:none; border:0; color:var(--dim); font-size:13px; cursor:pointer;
    font-family:inherit; padding:12px; min-height:44px; min-width:44px; border-radius:8px}
  footer button:active{color:var(--fg)}
</style>
</head>
<body>

<h1>记一餐</h1>

<form id="f" autocomplete="off">
  <input id="w" type="text" placeholder="吃了什么？" autofocus
         inputmode="text" enterkeyhint="done" aria-label="吃了什么">
  <div class="slots" role="group" aria-label="餐次">
    <button type="button" class="slot" data-slot="早餐">早餐</button>
    <button type="button" class="slot" data-slot="午餐">午餐</button>
    <button type="button" class="slot" data-slot="晚餐">晚餐</button>
    <button type="button" class="slot" data-slot="加餐">加餐</button>
  </div>
</form>

<div class="fb" id="fb"></div>
<div class="days" id="list"></div>

<footer>
  <button type="button" id="exp">导出数据</button>
  <button type="button" id="clr">清空</button>
</footer>

<script>
(function () {
  'use strict';

  var KEY = 'meals';

  // ---- 存储（坏数据不能让页面白屏）----
  function load() {
    try { var v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(meals)); } catch (e) {}
  }
  var meals = load();

  // ---- 时间 ----
  function pad(n) { return String(n).padStart(2, '0'); }
  function stamp(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
         + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function dayOf(iso) { return iso.slice(0, 10); }
  // 一周从周一算起
  function weekStart() {
    var d = new Date(); d.setHours(0, 0, 0, 0);
    var wd = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - wd);
    return d;
  }
  function defaultSlot() {
    var h = new Date().getHours();
    if (h < 10) return '早餐';
    if (h < 15) return '午餐';
    if (h < 21) return '晚餐';
    return '加餐';
  }
  function dayLabel(day) {
    var today = stamp(new Date()).slice(0, 10);
    var y = new Date(); y.setDate(y.getDate() - 1);
    if (day === today) return '今天';
    if (day === stamp(y).slice(0, 10)) return '昨天';
    var p = day.split('-');
    return p[1] + ' 月 ' + p[2] + ' 日';
  }

  var slot = defaultSlot();
  var $w = document.getElementById('w');
  var $fb = document.getElementById('fb');
  var $list = document.getElementById('list');
  var $slots = Array.prototype.slice.call(document.querySelectorAll('.slot'));

  function renderSlots() {
    $slots.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.slot === slot)); });
  }

  function render() {
    var today = stamp(new Date()).slice(0, 10);
    var ws = weekStart();
    var weekCount = meals.filter(function (m) { return new Date(m.at) >= ws; }).length;
    var todayCount = meals.filter(function (m) { return dayOf(m.at) === today; }).length;

    // 记完立刻给判断
    if (meals.length) {
      $fb.innerHTML = '今天第 <b>' + todayCount + '</b> 餐 · 本周 <b>' + weekCount + '</b> 餐'
        + '<span class="goal">（目标 18）</span>';
    } else {
      $fb.innerHTML = '<span class="goal">还没记过。打一句，回车。</span>';
    }

    // 本周列表（新的在上面）
    var recent = meals.filter(function (m) { return new Date(m.at) >= ws; })
                      .sort(function (a, b) { return b.at.localeCompare(a.at); });
    if (!recent.length) {
      $list.innerHTML = '<div class="empty">本周还没有记录。</div>';
      return;
    }
    var html = '', cur = '';
    recent.forEach(function (m) {
      var d = dayOf(m.at);
      if (d !== cur) { if (cur) html += '</div>'; html += '<div class="day"><h2>' + dayLabel(d) + '</h2>'; cur = d; }
      html += '<div class="row">'
            + '<span class="t">' + m.at.slice(11) + '</span>'
            + '<span class="s">' + m.slot + '</span>'
            + '<span class="w"></span>'
            + '<button type="button" data-del="' + m.id + '" aria-label="删除">×</button>'
            + '</div>';
    });
    html += '</div>';
    $list.innerHTML = html;

    // 文本用 textContent 写，避免把用户输入当 HTML
    var ws2 = $list.querySelectorAll('.row');
    recent.forEach(function (m, i) {
      if (ws2[i]) ws2[i].querySelector('.w').textContent = m.what;
    });
  }

  function add() {
    var what = $w.value.trim();
    if (!what) { $w.focus(); return; }
    meals.push({ id: String(Date.now()), at: stamp(new Date()), slot: slot, what: what });
    save();
    $w.value = '';
    $w.focus();          // 保持焦点：下一条还是"打字 + 回车"
    render();
  }

  // ---- 事件 ----
  document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); add(); });

  $slots.forEach(function (b) {
    b.addEventListener('click', function () {
      slot = b.dataset.slot;
      renderSlots();
      $w.focus();
    });
  });

  $list.addEventListener('click', function (e) {
    var id = e.target && e.target.getAttribute && e.target.getAttribute('data-del');
    if (!id) return;
    meals = meals.filter(function (m) { return m.id !== id; });
    save(); render();
  });

  document.getElementById('exp').addEventListener('click', function () {
    var text = JSON.stringify(meals, null, 2);
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () { alert('已复制 ' + meals.length + ' 条到剪贴板'); },
        function () { alert(text); });
    } else { alert(text); }
  });

  document.getElementById('clr').addEventListener('click', function () {
    if (!meals.length) return;
    var btn = this;
    if (btn.dataset.arm !== '1') { btn.dataset.arm = '1'; btn.textContent = '再点一次确认清空'; setTimeout(function () {
      btn.dataset.arm = '0'; btn.textContent = '清空';
    }, 4000); return; }
    meals = []; save(); render();
    btn.dataset.arm = '0'; btn.textContent = '清空';
  });

  renderSlots();
  render();

  // autofocus 属性在移动端（尤其 iOS Safari）不可靠，显式聚焦一次
  $w.focus();
  window.addEventListener('load', function () { $w.focus(); });

  // 点页面任意位置都能唤出键盘：少一次"瞄准输入框"的动作
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.closest && t.closest('button')) return;
    $w.focus();
  });
})();
</script>
</body>
</html>
