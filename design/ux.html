<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>记一餐 · UX 设计（可点 mockup）</title>
<style>
  :root{
    --bg:#0f0f11; --fg:#f2f2f3; --dim:#8a8a90; --line:#232326; --card:#16161a;
    --accent:#4ade80; --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0; background:#08080a; color:#d8d8dc;
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    padding:20px 16px 60px}
  .wrap{max-width:960px; margin:0 auto}

  /* ——— 审阅控件（不属于产品本身） ——— */
  .review{background:#141418; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:20px}
  .review h1{font-size:14px; margin:0 0 4px; color:#fff; font-weight:600}
  .review p{margin:0 0 10px; color:var(--dim); font-size:12px}
  .review .btns{display:flex; flex-wrap:wrap; gap:8px}
  .review button{
    font:inherit; font-size:13px; padding:10px 14px; min-height:44px; border-radius:10px;
    background:#1d1d22; color:#c8c8ce; border:1px solid var(--line); cursor:pointer;
  }
  .review button[aria-pressed=true]{background:var(--accent); border-color:var(--accent); color:#08210f; font-weight:600}
  .review .note{margin-top:10px; font-size:12px; color:var(--dim)}

  /* ——— 手机外框 ——— */
  .phone{
    width:390px; height:760px; margin:0 auto; background:var(--bg);
    border:1px solid #2a2a30; border-radius:34px; padding:14px 0 0;
    box-shadow:0 20px 60px rgba(0,0,0,.6); overflow:hidden; position:relative;
  }
  .app{height:100%; padding:0 18px 24px; overflow-y:auto}
  .app::-webkit-scrollbar{width:0}

  .brand{font-size:13px; font-weight:600; color:var(--dim); margin:4px 0 12px}

  /* ——— 输入区 ——— */
  input[type=text]{
    width:100%; font-size:21px; padding:15px 16px; border-radius:14px;
    background:#141416; color:var(--fg); border:1px solid var(--line); outline:none; font-family:inherit;
  }
  input[type=text]:focus{border-color:#3a3a44}
  input[type=text]::placeholder{color:#55555c}

  .slots{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px}
  .slot{
    min-height:48px; border-radius:12px; border:1px solid var(--line); background:#141416;
    color:var(--dim); font:inherit; font-size:14px; font-weight:500; cursor:pointer;
  }
  .slot[aria-pressed=true]{background:var(--accent); border-color:var(--accent); color:#08210f; font-weight:700}

  /* ——— 最近吃过 ——— */
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
  .chips .lbl{width:100%; font-size:12px; color:var(--dim); margin-bottom:-2px}
  .chip{
    min-height:44px; padding:0 14px; border-radius:22px; background:#1b1b20; border:1px solid var(--line);
    color:#d0d0d6; font:inherit; font-size:14px; cursor:pointer;
  }
  .chip:active{background:#232329}

  /* ——— 记完的判断 ——— */
  .fb{margin:18px 0 4px; font-size:17px; color:var(--fg)}
  .fb b{color:var(--accent); font-weight:700}
  .fb .sub{display:block; font-size:13px; color:var(--dim); margin-top:2px}

  /* ——— 本周格 ——— */
  .week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:14px}
  .day{text-align:center}
  .day .n{font-size:11px; color:var(--dim); margin-bottom:5px}
  .day .cells{display:flex; flex-direction:column; gap:3px; align-items:center; min-height:44px}
  .cell{width:100%; height:11px; border-radius:3px; background:var(--accent); opacity:.85}
  .cell.off{background:#232329; opacity:1}
  .day.today .n{color:var(--fg); font-weight:700}

  .summary{margin-top:16px; padding:14px; background:var(--card); border:1px solid var(--line); border-radius:12px}
  .summary .big{font-size:20px; font-weight:700; color:#fff}
  .summary .sub{font-size:13px; color:var(--dim); margin-top:4px}
  .summary .soft{color:var(--warn)}

  /* ——— 登录提示：一行小字，不打断 ——— */
  .login{
    margin-top:14px; padding:11px 13px; border:1px dashed #33333a; border-radius:11px;
    font-size:12.5px; color:var(--dim); display:flex; align-items:center; gap:10px;
  }
  .login button{
    margin-left:auto; min-height:44px; padding:0 14px; border-radius:9px; font:inherit; font-size:13px;
    background:none; border:1px solid #3a3a42; color:#b8b8be; cursor:pointer; white-space:nowrap;
  }
  .login.gone{display:none}

  .hint{color:var(--dim); font-size:13px; margin-top:14px}
  .tabbar{
    display:flex; gap:6px; margin-top:22px; padding-top:12px; border-top:1px solid var(--line);
  }
  .tabbar button{
    flex:1; min-height:44px; background:none; border:0; color:var(--dim); font:inherit; font-size:13px; cursor:pointer;
  }
  .tabbar button[aria-pressed=true]{color:var(--accent); font-weight:700}
  .footnote{margin-top:18px; font-size:11.5px; color:#5a5a62; line-height:1.7}
</style>
</head>
<body>
<div class="wrap">

  <div class="review">
    <h1>记一餐 · UX 设计（可点 mockup）</h1>
    <p>下面这些按钮是<strong>审阅控件，不属于产品本身</strong>。点一下就能跳到对应的界面状态。</p>
    <div class="btns" id="switcher">
      <button data-state="empty">1 首次打开</button>
      <button data-state="typing">2 记录中</button>
      <button data-state="logged">3 记完的判断</button>
      <button data-state="week">4 本周回顾</button>
      <button data-state="login">5 登录提示</button>
      <button data-state="gap">6 断记状态</button>
    </div>
    <div class="note" id="note"></div>
  </div>

  <div class="phone"><div class="app" id="app"></div></div>

  <p class="footnote">
    设计意图与取舍见 <code>design/weight-loss-app.md</code>。<br>
    留白是有意的：这里<strong>没有</strong>食物选择器、没有热量数字、没有社交入口、没有拍照按钮。
  </p>
</div>

<script>
(function () {
  'use strict';

  // ——— mock 数据（只是为了让界面看起来是真的） ———
  var WEEK = [
    { n: '周一', c: 3 }, { n: '周二', c: 3 }, { n: '周三', c: 0 },
    { n: '周四', c: 3 }, { n: '周五', c: 2 }, { n: '周六', c: 3 }, { n: '周日', c: 1 }
  ];
  var RECENT = ['牛肉面', '两个鸡蛋一杯美式', '公司食堂', '沙拉 + 鸡胸'];
  var TOTAL = WEEK.reduce(function (s, d) { return s + d.c; }, 0);
  var GAPDAY = '周三';

  var NOTES = {
    empty:  '零引导：打开就是输入框，光标已经在里面。当前时段（午餐）自动高亮。',
    typing: '「最近吃过」把第 2 次以后的记录压到 1 步——减肥的人反复吃同样的东西。',
    logged: '判断是对比型（"比昨天多一顿"），不是累计型。累计只给数字，对比自带判断。',
    week:   '一眼看出形态：7 个格子，空着的地方就是断的地方。不做折线图、不做百分比。',
    login:  '登录出现在第 2 条之后——第 1 条时他没有任何东西可丢。一行小字，不打断，关掉不再问。',
    gap:    '断记不惩罚、不羞辱、不断链。缺失自己会说话，不需要红字去骂它。'
  };

  var $app = document.getElementById('app');
  var $note = document.getElementById('note');
  var state = 'empty';

  function weekCells(mark) {
    return WEEK.map(function (d, i) {
      var cells = '';
      var n = d.c || 1;
      for (var k = 0; k < n; k++) {
        cells += '<div class="cell' + (d.c ? '' : ' off') + '"></div>';
      }
      var isToday = (i === 4);
      return '<div class="day' + (isToday ? ' today' : '') + '">' +
             '<div class="n">' + d.n + '</div>' +
             '<div class="cells">' + cells + '</div></div>';
    }).join('');
  }

  function inputRow(value, focus) {
    return '<input id="w" type="text" placeholder="吃了什么？" value="' + (value || '') + '"' +
           (focus ? ' autofocus' : '') + ' aria-label="吃了什么">' +
           '<div class="slots" role="group" aria-label="餐次">' +
           ['早餐', '午餐', '晚餐', '加餐'].map(function (s) {
             return '<button type="button" class="slot" data-slot="' + s + '" aria-pressed="' +
                    (s === '午餐') + '">' + s + '</button>';
           }).join('') + '</div>';
  }

  function render() {
    var h = '';

    if (state === 'empty') {
      h += '<div class="brand">记一餐</div>' + inputRow('', true) +
           '<div class="hint">打一句，回车。就这样。</div>';

    } else if (state === 'typing') {
      h += '<div class="brand">记一餐</div>' + inputRow('牛肉面', true) +
           '<div class="chips"><span class="lbl">最近吃过</span>' +
           RECENT.map(function (r) { return '<button type="button" class="chip">' + r + '</button>'; }).join('') +
           '</div>';

    } else if (state === 'logged') {
      h += '<div class="brand">记一餐</div>' + inputRow('', false) +
           '<div class="fb">今天第 <b>2</b> 餐 · <b>比昨天多一顿</b>' +
           '<span class="sub">本周 ' + TOTAL + ' 餐</span></div>' +
           '<div class="week">' + weekCells() + '</div>';

    } else if (state === 'week') {
      h += '<div class="brand">这周</div>' +
           '<div class="week">' + weekCells() + '</div>' +
           '<div class="summary">' +
             '<div class="big">' + TOTAL + ' 餐 · 记了 6 天</div>' +
             '<div class="sub">' + GAPDAY + '断了。<span class="soft">补一句也行，不补也没关系。</span></div>' +
           '</div>' +
           '<div class="tabbar">' +
             '<button type="button" aria-pressed="false">记一餐</button>' +
             '<button type="button" aria-pressed="true">这周</button>' +
           '</div>';

    } else if (state === 'login') {
      h += '<div class="brand">记一餐</div>' + inputRow('', false) +
           '<div class="fb">今天第 <b>2</b> 餐 · <b>比昨天多一顿</b>' +
           '<span class="sub">本周 ' + TOTAL + ' 餐</span></div>' +
           '<div class="login">登录后换手机也不会丢 · 现在不用' +
           '<button type="button">以后再说</button></div>' +
           '<div class="week">' + weekCells() + '</div>';

    } else if (state === 'gap') {
      h += '<div class="brand">这周</div>' +
           '<div class="week">' + weekCells() + '</div>' +
           '<div class="summary">' +
             '<div class="big">本周 5 / 7 天</div>' +
             '<div class="sub">' + GAPDAY + '空着。<span class="soft">想补就补一句，不补也不会怎样。</span></div>' +
           '</div>' +
           '<div class="hint">这里<strong>没有</strong>「连续 0 天」「你已 3 天没记录」这类东西——' +
           '记录工具让人有负罪感，是它被卸载的头号原因。</div>';
    }

    $app.innerHTML = h;
    $note.textContent = NOTES[state] || '';

    Array.prototype.forEach.call(document.querySelectorAll('#switcher button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === state));
    });

    // 让「记录中」的输入框真的能打字（演示 ≤3 步）
    var w = document.getElementById('w');
    if (w) {
      w.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); setState('logged'); }
      });
      Array.prototype.forEach.call(document.querySelectorAll('.slot'), function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('.slot').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true');
          w.focus();
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (b) {
        b.addEventListener('click', function () { w.value = b.textContent; w.focus(); });
      });
      if (state === 'empty' || state === 'typing') w.focus();
    }
  }

  function setState(s) { state = s; render(); }

  document.getElementById('switcher').addEventListener('click', function (e) {
    var s = e.target && e.target.dataset && e.target.dataset.state;
    if (s) setState(s);
  });

  render();
})();
</script>
</body>
</html>
